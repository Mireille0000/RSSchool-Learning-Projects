<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee house: menu</title>
    <link rel="stylesheet" href="menu-style.css">
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="header-wrapper">
                <div class="header-logo"><img src="./images and icons/logo.svg" alt="header-logo"></div>
                    <nav>
                        <ul>
                            <li><a href="#favourite-coffee" class="anchor">Favorite coffee</a></li>
                            <li><a href="#about" class="anchor">About</a></li>
                            <li><a href="#" class="anchor">Mobile app</a></li>
                            <li><a href="#" class="anchor">Contact us</a></li>
                            <li><a href="#" class="anchor">Menu<img src="./images and icons/coffee-cup.svg" alt="coffee cup" class="coffee-cup-icon"></a></li>
                        </ul>
                    </nav>
                </div>
        </header>
        <main>
            <div class="coffee-menu-wrapper">
                <h1>Behind each of our cups hides an <span>amazing surprise</span></h1>
                <div class="menu-icons">
                    <div class="menu-icons-item"><img src="./images and icons/coffee-icon.svg" alt="coffee">Coffee</div>
                    <div class="menu-icons-item"><img src="./images and icons/tea-icon.svg" alt="tea">Tea</div>
                    <div class="menu-icons-item"><img src="./images and icons/dessert-icon.svg" alt="dessert">Dessert</div>
                </div>

                <div class="coffee-menu"></div>
            </div>
        </main>
        <footer>

        </footer>
    </div>
